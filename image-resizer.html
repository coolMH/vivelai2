<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Resizer - Vivel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-white text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    
    <div id="header-container"></div>

    <main class="flex-grow">
      <div class="max-w-6xl mx-auto space-y-8 px-4 py-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
          <h1 class="text-3xl font-bold text-slate-900 flex items-center justify-center gap-2">
            <i data-lucide="scaling" class="w-8 h-8 text-blue-600"></i>
            <span>Image Resizer</span>
          </h1>
          <p class="text-slate-600 text-sm max-w-lg mx-auto">
            Resize images to precise dimensions and convert between PNG, JPEG, and WebP formats without loss of clarity.
          </p>
        </div>

        <!-- Initial Upload View -->
        <div id="upload-view" class="space-y-6">
          <div class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-3xl p-12 text-center bg-slate-50 transition-all">
            <input
              type="file"
              accept="image/*"
              class="hidden"
              id="resizer-upload"
            />
            <label for="resizer-upload" class="cursor-pointer space-y-4 inline-block">
              <div class="w-16 h-16 rounded-2xl bg-blue-100 border border-blue-200 text-blue-600 flex items-center justify-center mx-auto shadow-xs">
                <i data-lucide="upload" class="w-8 h-8"></i>
              </div>
              <div>
                <h3 class="text-slate-900 font-semibold text-base mb-1">
                  Upload Image to Resize
                </h3>
                <p class="text-slate-500 text-xs">Supports PNG, JPG, WebP formats</p>
              </div>
              <span class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow-xs">
                Browse File
              </span>
            </label>
          </div>

          <div id="sample-picker-container"></div>
        </div>

        <!-- Workspace View (hidden initially) -->
        <div id="workspace-view" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
          
          <!-- Controls Column -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 space-y-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200">
              <span class="text-sm font-bold text-slate-900">Resize Controls</span>
              <button
                id="btn-change-image"
                class="text-xs text-blue-600 hover:underline cursor-pointer"
              >
                Change Image
              </button>
            </div>

            <!-- Presets Grid -->
            <div class="space-y-2">
              <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Social & Web Presets</label>
              <div class="grid grid-cols-2 gap-2" id="preset-buttons">
                <button data-w="1080" data-h="1080" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">Instagram Post (1:1)</div>
                  <div class="text-[10px] text-slate-500 font-mono">1080 × 1080 px</div>
                </button>
                <button data-w="1080" data-h="1920" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">Story / Reel (9:16)</div>
                  <div class="text-[10px] text-slate-500 font-mono">1080 × 1920 px</div>
                </button>
                <button data-w="1280" data-h="720" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">YouTube Thumbnail</div>
                  <div class="text-[10px] text-slate-500 font-mono">1280 × 720 px</div>
                </button>
                <button data-w="1500" data-h="500" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">Twitter Header</div>
                  <div class="text-[10px] text-slate-500 font-mono">1500 × 500 px</div>
                </button>
                <button data-w="600" data-h="600" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">Passport Photo</div>
                  <div class="text-[10px] text-slate-500 font-mono">600 × 600 px</div>
                </button>
                <button data-w="1920" data-h="1080" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors cursor-pointer">
                  <div class="text-slate-900 font-medium truncate">Web HD</div>
                  <div class="text-[10px] text-slate-500 font-mono">1920 × 1080 px</div>
                </button>
              </div>
            </div>

            <!-- Dimensions -->
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Dimensions (px)</label>
                <button
                  id="btn-toggle-aspect"
                  class="flex items-center space-x-1 text-xs px-2 py-0.5 rounded border transition-colors bg-blue-50 text-blue-700 border-blue-200 font-semibold cursor-pointer"
                >
                  <i data-lucide="link" class="w-3 h-3 text-blue-600"></i>
                  <span id="aspect-status-text">Aspect Locked</span>
                </button>
              </div>

              <div class="grid grid-cols-2 gap-3 items-center">
                <div>
                  <label class="text-[11px] text-slate-600 mb-1 block">Width</label>
                  <input
                    type="number"
                    min="1"
                    max="10000"
                    id="input-width"
                    class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-900 font-mono text-sm focus:border-blue-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label class="text-[11px] text-slate-600 mb-1 block">Height</label>
                  <input
                    type="number"
                    min="1"
                    max="10000"
                    id="input-height"
                    class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-slate-900 font-mono text-sm focus:border-blue-500 focus:outline-none"
                  />
                </div>
              </div>
            </div>

            <!-- Format & Quality -->
            <div class="space-y-3">
              <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Format & Quality</label>
              <div class="grid grid-cols-3 gap-2">
                <button id="fmt-png" class="py-1.5 rounded-lg text-xs font-semibold border transition-colors bg-blue-600 border-blue-600 text-white cursor-pointer">PNG</button>
                <button id="fmt-jpg" class="py-1.5 rounded-lg text-xs font-semibold border transition-colors bg-white border-slate-200 text-slate-700 hover:bg-slate-100 cursor-pointer">JPEG</button>
                <button id="fmt-webp" class="py-1.5 rounded-lg text-xs font-semibold border transition-colors bg-white border-slate-200 text-slate-700 hover:bg-slate-100 cursor-pointer">WEBP</button>
              </div>

              <div class="space-y-1 pt-2">
                <div class="flex justify-between text-xs text-slate-600">
                  <span>Output Quality:</span>
                  <span id="quality-val-display" class="text-slate-900 font-mono font-bold">92%</span>
                </div>
                <input
                  type="range"
                  min="0.1"
                  max="1.0"
                  step="0.05"
                  value="0.92"
                  id="quality-slider"
                  class="w-full accent-blue-600 cursor-pointer"
                />
              </div>
            </div>

            <button
              id="btn-apply-resize"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-xs flex items-center justify-center space-x-2 transition-all cursor-pointer"
            >
              <i data-lucide="sparkles" class="w-4 h-4"></i>
              <span id="apply-btn-text">Apply Resize</span>
            </button>
          </div>

          <!-- Preview & Result Column -->
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center space-y-4">
              <div class="flex items-center justify-between text-xs text-slate-600 pb-3 border-b border-slate-200">
                <span>Original: <strong id="orig-dim-display" class="text-slate-900">0 × 0 px</strong> (<span id="orig-size-display">0 KB</span>)</span>
                <span id="resized-dim-display" class="text-blue-600 font-semibold hidden">Resized: 0 × 0 px</span>
              </div>

              <div class="max-h-[500px] overflow-auto flex items-center justify-center p-4 bg-white rounded-xl border border-slate-200">
                <img
                  id="preview-img"
                  src=""
                  alt="Preview"
                  class="max-h-[420px] object-contain rounded-lg shadow-xs"
                />
              </div>

              <div id="download-box" class="pt-2 flex justify-end hidden">
                <a
                  id="btn-download-resized"
                  href="#"
                  download="resized-image.png"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-xs flex items-center space-x-2 transition-all"
                >
                  <i data-lucide="download" class="w-4 h-4"></i>
                  <span>Download Resized Image</span>
                </a>
              </div>
            </div>
          </div>

        </div>

      </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/imageProcessing.js"></script>
    <script src="js/sampleImages.js"></script>
    <script src="js/components.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderHeader('image-resizer');
        renderFooter();

        let imageSrc = null;
        let imageName = 'landscape-sample.png';
        let imgObj = null;
        let origW = 0;
        let origH = 0;
        let origSize = 0;

        let targetW = 1920;
        let targetH = 1080;
        let lockAspect = true;
        let outputFormat = 'image/png';
        let outputQuality = 0.92;

        const uploadView = document.getElementById('upload-view');
        const workspaceView = document.getElementById('workspace-view');
        const previewImg = document.getElementById('preview-img');
        const btnChangeImage = document.getElementById('btn-change-image');

        const inputWidth = document.getElementById('input-width');
        const inputHeight = document.getElementById('input-height');
        const btnToggleAspect = document.getElementById('btn-toggle-aspect');
        const aspectStatusText = document.getElementById('aspect-status-text');

        const fmtPng = document.getElementById('fmt-png');
        const fmtJpg = document.getElementById('fmt-jpg');
        const fmtWebp = document.getElementById('fmt-webp');
        const qualitySlider = document.getElementById('quality-slider');
        const qualityValDisplay = document.getElementById('quality-val-display');

        const btnApplyResize = document.getElementById('btn-apply-resize');
        const applyBtnText = document.getElementById('apply-btn-text');

        const origDimDisplay = document.getElementById('orig-dim-display');
        const origSizeDisplay = document.getElementById('orig-size-display');
        const resizedDimDisplay = document.getElementById('resized-dim-display');
        const downloadBox = document.getElementById('download-box');
        const btnDownloadResized = document.getElementById('btn-download-resized');

        initSamplePicker('sample-picker-container', 'landscape', (url, name) => {
          imageName = name;
          setupImage(url);
        });

        document.getElementById('resizer-upload').addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            imageName = file.name;
            setupImage(URL.createObjectURL(file), file.size);
          }
        });

        async function setupImage(srcUrl, bytes) {
          imageSrc = srcUrl;
          imgObj = await loadImage(srcUrl);

          origW = imgObj.naturalWidth || imgObj.width;
          origH = imgObj.naturalHeight || imgObj.height;
          origSize = bytes || Math.round(srcUrl.length * 0.75);

          targetW = origW;
          targetH = origH;

          inputWidth.value = targetW;
          inputHeight.value = targetH;
          previewImg.src = srcUrl;

          origDimDisplay.textContent = `${origW} × ${origH} px`;
          origSizeDisplay.textContent = formatBytes(origSize);
          resizedDimDisplay.classList.add('hidden');
          downloadBox.classList.add('hidden');

          uploadView.classList.add('hidden');
          workspaceView.classList.remove('hidden');
        }

        function formatBytes(b) {
          if (b < 1024) return b + ' B';
          if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
          return (b / (1024 * 1024)).toFixed(2) + ' MB';
        }

        btnChangeImage.addEventListener('click', () => {
          workspaceView.classList.add('hidden');
          uploadView.classList.remove('hidden');
        });

        // Presets
        document.querySelectorAll('#preset-buttons button').forEach(b => {
          b.addEventListener('click', () => {
            targetW = parseInt(b.getAttribute('data-w'));
            targetH = parseInt(b.getAttribute('data-h'));
            inputWidth.value = targetW;
            inputHeight.value = targetH;
            lockAspect = false;
            updateAspectUI();
          });
        });

        inputWidth.addEventListener('input', (e) => {
          targetW = Math.max(1, parseInt(e.target.value) || 1);
          if (lockAspect && origW) {
            targetH = Math.round(targetW * (origH / origW));
            inputHeight.value = targetH;
          }
        });

        inputHeight.addEventListener('input', (e) => {
          targetH = Math.max(1, parseInt(e.target.value) || 1);
          if (lockAspect && origH) {
            targetW = Math.round(targetH * (origW / origH));
            inputWidth.value = targetW;
          }
        });

        function updateAspectUI() {
          if (lockAspect) {
            btnToggleAspect.className = 'flex items-center space-x-1 text-xs px-2 py-0.5 rounded border transition-colors bg-blue-50 text-blue-700 border-blue-200 font-semibold cursor-pointer';
            aspectStatusText.textContent = 'Aspect Locked';
          } else {
            btnToggleAspect.className = 'flex items-center space-x-1 text-xs px-2 py-0.5 rounded border transition-colors bg-white text-slate-500 border-slate-200 cursor-pointer';
            aspectStatusText.textContent = 'Unlocked';
          }
        }

        btnToggleAspect.addEventListener('click', () => {
          lockAspect = !lockAspect;
          updateAspectUI();
        });

        // Formats
        function setFormat(fmt) {
          outputFormat = fmt;
          fmtPng.className = `py-1.5 rounded-lg text-xs font-semibold border transition-colors cursor-pointer ${fmt === 'image/png' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`;
          fmtJpg.className = `py-1.5 rounded-lg text-xs font-semibold border transition-colors cursor-pointer ${fmt === 'image/jpeg' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`;
          fmtWebp.className = `py-1.5 rounded-lg text-xs font-semibold border transition-colors cursor-pointer ${fmt === 'image/webp' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'}`;
        }

        fmtPng.addEventListener('click', () => setFormat('image/png'));
        fmtJpg.addEventListener('click', () => setFormat('image/jpeg'));
        fmtWebp.addEventListener('click', () => setFormat('image/webp'));

        qualitySlider.addEventListener('input', (e) => {
          outputQuality = parseFloat(e.target.value);
          qualityValDisplay.textContent = Math.round(outputQuality * 100) + '%';
        });

        btnApplyResize.addEventListener('click', async () => {
          if (!imgObj) return;
          btnApplyResize.disabled = true;
          applyBtnText.textContent = 'Resizing...';

          try {
            const res = await processImageResize(imgObj, {
              width: targetW,
              height: targetH,
              scaleMode: 'fit',
              format: outputFormat,
              quality: outputQuality
            });

            previewImg.src = res.dataUrl;
            resizedDimDisplay.textContent = `Resized: ${res.width} × ${res.height} px (${formatBytes(res.blob.size)})`;
            resizedDimDisplay.classList.remove('hidden');

            const ext = outputFormat.includes('jpeg') ? '.jpg' : outputFormat.includes('webp') ? '.webp' : '.png';
            btnDownloadResized.href = res.dataUrl;
            btnDownloadResized.download = `resized-${targetW}x${targetH}-${imageName.replace(/\.[^/.]+$/, '')}${ext}`;
            downloadBox.classList.remove('hidden');
          } catch (err) {
            console.error(err);
          } finally {
            btnApplyResize.disabled = false;
            applyBtnText.textContent = 'Apply Resize';
          }
        });
      });
    </script>
  </body>
</html>
