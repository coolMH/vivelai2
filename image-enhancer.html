<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Enhancer - Vivel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-white text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    
    <div id="header-container"></div>

    <main class="flex-grow">
      <div class="max-w-6xl mx-auto space-y-8 px-4 py-6">
        
        <!-- Title -->
        <div class="text-center space-y-2">
          <h1 class="text-3xl font-bold text-slate-900 flex items-center justify-center gap-2">
            <i data-lucide="sliders-horizontal" class="w-8 h-8 text-blue-600"></i>
            <span>Image Enhancer</span>
          </h1>
          <p class="text-slate-600 text-sm max-w-lg mx-auto">
            Boost detail, sharpness, color saturation, and contrast for stunning photo clarity.
          </p>
        </div>

        <!-- Upload View -->
        <div id="upload-view" class="space-y-6">
          <div class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-3xl p-12 text-center bg-slate-50 transition-all">
            <input
              type="file"
              accept="image/*"
              class="hidden"
              id="enhancer-upload"
            />
            <label for="enhancer-upload" class="cursor-pointer space-y-4 inline-block">
              <div class="w-16 h-16 rounded-2xl bg-blue-100 border border-blue-200 text-blue-600 flex items-center justify-center mx-auto shadow-xs">
                <i data-lucide="upload" class="w-8 h-8"></i>
              </div>
              <div>
                <h3 class="text-slate-900 font-semibold text-base mb-1">
                  Upload Image to Enhance
                </h3>
                <p class="text-slate-500 text-xs">PNG, JPG, WebP supported</p>
              </div>
              <span class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow-xs">
                Browse Image
              </span>
            </label>
          </div>

          <div id="sample-picker-container"></div>
        </div>

        <!-- Workspace View (hidden initially) -->
        <div id="workspace-view" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
          
          <!-- Controls Column -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 space-y-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200">
              <span class="text-sm font-bold text-slate-900">Enhancement Controls</span>
              <button
                id="btn-reset"
                class="text-xs text-slate-500 hover:text-slate-900 flex items-center space-x-1 cursor-pointer"
              >
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Reset</span>
              </button>
            </div>

            <!-- Quick Presets -->
            <div class="space-y-2">
              <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Quick Presets</label>
              <div class="grid grid-cols-2 gap-2" id="preset-buttons">
                <button data-preset="hdr" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>✨</span>
                  <span class="text-slate-900 font-medium truncate">HDR Detail</span>
                </button>
                <button data-preset="vivid" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>🎨</span>
                  <span class="text-slate-900 font-medium truncate">Vivid Color</span>
                </button>
                <button data-preset="crisp" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>🔪</span>
                  <span class="text-slate-900 font-medium truncate">Crisp Sharpen</span>
                </button>
                <button data-preset="sunset" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>🌅</span>
                  <span class="text-slate-900 font-medium truncate">Warm Sunset</span>
                </button>
                <button data-preset="twilight" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>🌙</span>
                  <span class="text-slate-900 font-medium truncate">Cool Twilight</span>
                </button>
                <button data-preset="bw" class="p-2 text-left bg-white hover:bg-slate-100 border border-slate-200 hover:border-blue-500/60 rounded-lg text-xs transition-colors flex items-center space-x-2 cursor-pointer">
                  <span>🎬</span>
                  <span class="text-slate-900 font-medium truncate">Dramatic B&W</span>
                </button>
              </div>
            </div>

            <!-- Fine-Grained Sliders -->
            <div class="space-y-4">
              
              <!-- Sharpness -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-blue-600"></i>
                    <span>Sharpness:</span>
                  </span>
                  <span id="val-sharpness" class="font-mono text-blue-600 font-bold">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" id="slider-sharpness" class="w-full accent-blue-600 cursor-pointer" />
              </div>

              <!-- Brightness -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-500"></i>
                    <span>Brightness:</span>
                  </span>
                  <span id="val-brightness" class="font-mono text-slate-800">0</span>
                </div>
                <input type="range" min="-100" max="100" value="0" id="slider-brightness" class="w-full accent-blue-600 cursor-pointer" />
              </div>

              <!-- Contrast -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="contrast" class="w-3.5 h-3.5 text-indigo-600"></i>
                    <span>Contrast:</span>
                  </span>
                  <span id="val-contrast" class="font-mono text-slate-800">0</span>
                </div>
                <input type="range" min="-100" max="100" value="0" id="slider-contrast" class="w-full accent-blue-600 cursor-pointer" />
              </div>

              <!-- Saturation -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="flame" class="w-3.5 h-3.5 text-rose-500"></i>
                    <span>Saturation:</span>
                  </span>
                  <span id="val-saturation" class="font-mono text-slate-800">0</span>
                </div>
                <input type="range" min="-100" max="100" value="0" id="slider-saturation" class="w-full accent-blue-600 cursor-pointer" />
              </div>

              <!-- Temperature -->
              <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-700">
                  <span>Temperature (Warm / Cool):</span>
                  <span id="val-temperature" class="font-mono text-slate-800">0</span>
                </div>
                <input type="range" min="-100" max="100" value="0" id="slider-temperature" class="w-full accent-blue-600 cursor-pointer" />
              </div>

            </div>

            <div class="pt-2">
              <button
                id="btn-change-image"
                class="w-full py-2 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-xl font-medium transition-colors cursor-pointer"
              >
                Choose Different Image
              </button>
            </div>
          </div>

          <!-- Result Column Slider -->
          <div class="lg:col-span-2 space-y-6">
            <div id="result-slider-container"></div>
          </div>

        </div>

      </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/imageProcessing.js"></script>
    <script src="js/sampleImages.js"></script>
    <script src="js/components.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderHeader('image-enhancer');
        renderFooter();

        let imageSrc = null;
        let imageName = 'landscape-sample.png';
        let imgObj = null;

        let settings = {
          brightness: 0,
          contrast: 0,
          saturation: 0,
          sharpness: 0,
          temperature: 0,
          blur: 0
        };

        const uploadView = document.getElementById('upload-view');
        const workspaceView = document.getElementById('workspace-view');
        const btnChangeImage = document.getElementById('btn-change-image');
        const btnReset = document.getElementById('btn-reset');

        const sliderSharpness = document.getElementById('slider-sharpness');
        const sliderBrightness = document.getElementById('slider-brightness');
        const sliderContrast = document.getElementById('slider-contrast');
        const sliderSaturation = document.getElementById('slider-saturation');
        const sliderTemperature = document.getElementById('slider-temperature');

        const valSharpness = document.getElementById('val-sharpness');
        const valBrightness = document.getElementById('val-brightness');
        const valContrast = document.getElementById('val-contrast');
        const valSaturation = document.getElementById('val-saturation');
        const valTemperature = document.getElementById('val-temperature');

        initSamplePicker('sample-picker-container', 'landscape', (url, name) => {
          imageName = name;
          setupImage(url);
        });

        document.getElementById('enhancer-upload').addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            imageName = file.name;
            setupImage(URL.createObjectURL(file));
          }
        });

        async function setupImage(srcUrl) {
          imageSrc = srcUrl;
          imgObj = await loadImage(srcUrl);

          uploadView.classList.add('hidden');
          workspaceView.classList.remove('hidden');

          resetSettings();
        }

        btnChangeImage.addEventListener('click', () => {
          workspaceView.classList.add('hidden');
          uploadView.classList.remove('hidden');
        });

        function resetSettings() {
          settings = { brightness: 0, contrast: 0, saturation: 0, sharpness: 0, temperature: 0, blur: 0 };
          updateUI();
          applyEnhancement();
        }

        btnReset.addEventListener('click', resetSettings);

        function updateUI() {
          sliderSharpness.value = settings.sharpness;
          sliderBrightness.value = settings.brightness;
          sliderContrast.value = settings.contrast;
          sliderSaturation.value = settings.saturation;
          sliderTemperature.value = settings.temperature;

          valSharpness.textContent = settings.sharpness + '%';
          valBrightness.textContent = settings.brightness;
          valContrast.textContent = settings.contrast;
          valSaturation.textContent = settings.saturation;
          valTemperature.textContent = settings.temperature;
        }

        async function applyEnhancement() {
          if (!imgObj) return;
          try {
            const resultUrl = await processImageEnhancement(imgObj, settings);
            initBeforeAfterSlider('result-slider-container', {
              originalUrl: imageSrc,
              processedUrl: resultUrl,
              downloadFilename: 'enhanced-' + imageName,
              title: 'AI Enhancement Comparison'
            });
          } catch (err) {
            console.error(err);
          }
        }

        // Slider Listeners
        sliderSharpness.addEventListener('input', (e) => {
          settings.sharpness = Number(e.target.value);
          valSharpness.textContent = settings.sharpness + '%';
          applyEnhancement();
        });

        sliderBrightness.addEventListener('input', (e) => {
          settings.brightness = Number(e.target.value);
          valBrightness.textContent = settings.brightness;
          applyEnhancement();
        });

        sliderContrast.addEventListener('input', (e) => {
          settings.contrast = Number(e.target.value);
          valContrast.textContent = settings.contrast;
          applyEnhancement();
        });

        sliderSaturation.addEventListener('input', (e) => {
          settings.saturation = Number(e.target.value);
          valSaturation.textContent = settings.saturation;
          applyEnhancement();
        });

        sliderTemperature.addEventListener('input', (e) => {
          settings.temperature = Number(e.target.value);
          valTemperature.textContent = settings.temperature;
          applyEnhancement();
        });

        // Presets
        document.querySelectorAll('#preset-buttons button').forEach(b => {
          b.addEventListener('click', () => {
            const p = b.getAttribute('data-preset');
            if (p === 'hdr') {
              settings = { sharpness: 60, contrast: 25, saturation: 20, brightness: 5, temperature: 0, blur: 0 };
            } else if (p === 'vivid') {
              settings = { sharpness: 0, saturation: 45, brightness: 10, contrast: 15, temperature: 0, blur: 0 };
            } else if (p === 'crisp') {
              settings = { sharpness: 80, contrast: 10, brightness: 0, saturation: 0, temperature: 0, blur: 0 };
            } else if (p === 'sunset') {
              settings = { temperature: 35, saturation: 25, brightness: 5, sharpness: 0, contrast: 0, blur: 0 };
            } else if (p === 'twilight') {
              settings = { temperature: -30, contrast: 15, brightness: 0, saturation: 0, sharpness: 0, blur: 0 };
            } else if (p === 'bw') {
              settings = { saturation: -100, contrast: 45, sharpness: 40, brightness: 0, temperature: 0, blur: 0 };
            }
            updateUI();
            applyEnhancement();
          });
        });

      });
    </script>
  </body>
</html>
